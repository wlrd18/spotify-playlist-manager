<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Playlist intelligence</title>
  <style>
    :root{color-scheme:dark;--bg:#101311;--panel:#19201b;--line:#304236;--text:#ecf5ed;--muted:#9eb2a2;--accent:#1ed760;--warn:#f4bb4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px}header{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:30px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}p{color:var(--muted);margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.profiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.metric{font-size:30px;font-weight:700;color:var(--accent)}section{margin:30px 0}button,a.button{background:var(--accent);color:#063014;border:0;border-radius:8px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}button:disabled{opacity:.5}.notice{border:1px solid var(--warn);color:#ffdb8d;padding:12px;border-radius:8px;margin:18px 0}.small{font-size:13px;color:var(--muted)}.progress{height:10px;background:#26352a;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .35s ease}table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}tr:last-child td{border:0}.link{padding:0;background:none;color:var(--accent);font:inherit;text-align:left}.pill{display:inline-block;padding:3px 7px;background:#26352a;border-radius:20px;font-size:12px;margin:2px 4px 2px 0}.outlier{background:#3b2626}.outlier-pill{background:#6d3535;color:#ffd6d6}@media(max-width:700px){.grid,.profiles{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}table{font-size:13px}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>Playlist intelligence</h1><p>Your playlists only. Read-only analysis.</p></div><div id="actions"></div></header>
    <div id="app">Loading...</div><div id="detail"></div>
  </main>
  <script>
    const app=document.querySelector('#app'),detail=document.querySelector('#detail'),actions=document.querySelector('#actions');let currentJob=localStorage.getItem('playlistSyncJob');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,opts){const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
    function pct(x){return x==null?'—':Math.round(x*100)+'%'}
    function songRows(tracks){return tracks.map(t=>`<tr><td>${t.position+1}</td><td>${esc(t.name||'Unavailable track')}</td></tr>`).join('')}
    async function load(){const health=await api('/api/health');actions.innerHTML=health.spotify_connected?'<button id="sync">Sync Spotify</button> <button class="secondary" id="disconnect">Disconnect</button>':'<a class="button" href="/api/auth/spotify/start">Connect Spotify</a>';if(health.spotify_connected){document.querySelector('#sync').onclick=startSync;document.querySelector('#disconnect').onclick=async()=>{await api('/api/auth/disconnect',{method:'POST'});localStorage.removeItem('playlistSyncJob');load()}}if(currentJob){const j=await api('/api/sync/'+currentJob).catch(()=>null);if(j&&j.status==='running'){actions.innerHTML='<button disabled>Syncing…</button>';renderSync(j);poll();return}localStorage.removeItem('playlistSyncJob');currentJob=null}const data=await api('/api/dashboard');app.innerHTML=`<div class="grid"><div class="card"><div class="metric">${data.totals.playlists||0}</div><div>playlists you own</div></div><div class="card"><div class="metric">${data.totals.readable||0}</div><div>playlists analyzed</div></div><div class="card"><div class="metric">${data.totals.items||0}</div><div>listed items</div></div></div><section><h2>Your playlists</h2><p class="small">Select a playlist to see its songs and exact shared tracks.</p><div class="profiles">${data.playlists.map(p=>`<article class="card"><button class="link open" data-id="${p.id}"><h3>${esc(p.name)}</h3></button></article>`).join('')||'<div class="card">Connect Spotify and run a sync to see playlists.</div>'}</div></section><section><h2>Shared tracks between playlists</h2><table><thead><tr><th>Pair</th><th>Shared</th><th>Overlap</th><th>Open</th></tr></thead><tbody>${data.pairs.map(p=>`<tr><td>${esc(p.a)} / ${esc(p.b)}</td><td>${p.shared_tracks}</td><td>${pct(p.jaccard)}</td><td><button class="secondary compare" data-a="${p.playlist_a_id}" data-b="${p.playlist_b_id}">Show tracks</button></td></tr>`).join('')||'<tr><td colspan="4">No playlists share tracks yet.</td></tr>'}</tbody></table></section>`;document.querySelectorAll('.open').forEach(b=>b.onclick=()=>showPlaylist(b.dataset.id));document.querySelectorAll('.compare').forEach(b=>b.onclick=()=>showComparison(b.dataset.a,b.dataset.b))}
    function renderSync(j){const done=(j.readable_playlists||0)+(j.skipped_playlists||0),total=j.listed_playlists||0,percent=total?Math.min(100,Math.round(done/total*100)):0;app.innerHTML=`<section class="card"><h2>Syncing playlists</h2><p>${esc(j.stage||'Starting…')}</p><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${percent}%"></span></div><p><strong>${done} of ${total||'…'}</strong> playlists processed · ${percent}%</p><p class="small">${j.imported_items||0} items imported · ${j.skipped_playlists||0} skipped</p><p class="small">This continues in the cloud. You can close this page and return later.</p></section>`}
    async function startSync(){const x=await api('/api/sync',{method:'POST'});currentJob=x.job_id;localStorage.setItem('playlistSyncJob',currentJob);actions.innerHTML='<button disabled>Syncing…</button>';poll()}
    async function poll(){try{const j=await api('/api/sync/'+currentJob);renderSync(j);if(j.status==='running')setTimeout(poll,1200);else{localStorage.removeItem('playlistSyncJob');currentJob=null;load()}}catch(e){app.innerHTML='<div class="notice">Could not refresh sync progress. Reload the page to try again.</div>'}}
    async function showPlaylist(id){const p=await api('/api/playlists/'+id);detail.style.display='block';detail.innerHTML=`<section class="card"><button class="secondary" id="close">Close</button><h2 style="margin-top:16px">${esc(p.name)}</h2><h2 style="margin-top:24px">Songs</h2><table><thead><tr><th>#</th><th>Song</th></tr></thead><tbody>${songRows(p.tracks)}</tbody></table><div style="margin-top:20px"><a class="button" href="${esc(p.spotify_url||'#')}" target="_blank" rel="noopener">Open in Spotify</a></div><h2 style="margin-top:24px">Shared tracks with</h2>${p.comparisons.length?`<ul>${p.comparisons.map(c=>`<li><button class="link comparison" data-a="${p.id}" data-b="${c.id}">${esc(c.name)}</button> · ${pct(c.jaccard)} overlap</li>`).join('')}</ul>`:'<p>No shared tracks with your other playlists.</p>'}</section>`;detail.scrollIntoView({behavior:'smooth'});document.querySelector('#close').onclick=()=>detail.style.display='none';document.querySelectorAll('.comparison').forEach(b=>b.onclick=()=>showComparison(b.dataset.a,b.dataset.b))}
    async function showComparison(a,b){const x=await api('/api/comparisons/'+a+'/'+b);detail.style.display='block';detail.innerHTML=`<section class="card"><button class="secondary" id="close">Close</button><h2 style="margin-top:16px">${esc(x.pair.a_name)} and ${esc(x.pair.b_name)}</h2><p>${x.pair.shared_tracks} shared tracks. ${pct(x.pair.jaccard)} collection overlap.</p><table><thead><tr><th>Track</th><th>Artist</th><th>Position in first</th><th>Position in second</th></tr></thead><tbody>${x.tracks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.artist)}</td><td>${esc(t.a_positions)}</td><td>${esc(t.b_positions)}</td></tr>`).join('')}</tbody></table></section>`;detail.scrollIntoView({behavior:'smooth'});document.querySelector('#close').onclick=()=>detail.style.display='none'}
    load().catch(e=>app.innerHTML='<div class="notice">'+esc(e.message)+'</div>');
  </script>
</body>
</html>
